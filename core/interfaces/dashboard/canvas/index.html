<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    color: #1f2733;
    background: #ffffff;
  }
  .wrap { display: flex; border: 1px solid rgba(128,128,128,.28); border-radius: 10px; overflow: hidden; }
  .wrap.palette-off .palette { display: none; }
  .palette {
    width: 152px;
    flex: 0 0 152px;
    background: #f7f9fc;
    border-right: 1px solid rgba(128,128,128,.18);
    padding: 8px;
    max-height: 470px;
    overflow-y: auto;
  }
  .palette h4 { margin: 0 0 6px; font-size: 11px; color: #5b6b82; font-weight: 600; }
  .block {
    cursor: grab;
    background: #ffffff;
    border: 1px solid rgba(76,125,240,.35);
    border-radius: 8px;
    padding: 4px 6px;
    margin-bottom: 5px;
    line-height: 1.3;
  }
  .block b { font-weight: 600; color: #2b3a55; }
  .block span { color: #8a97a8; font-size: 10px; display: block; }
  .block:active { cursor: grabbing; }
  .board { flex: 1 1 auto; position: relative; background:
      linear-gradient(#eef2f8 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, #eef2f8 1px, transparent 1px) 0 0 / 24px 24px,
      #ffffff; }
  svg { display: block; width: 100%; height: 470px; user-select: none; }
  .hint {
    position: absolute; left: 10px; top: 8px; right: 10px;
    color: #7a8798; font-size: 11px; pointer-events: none;
  }
  .flash {
    position: absolute; right: 10px; bottom: 8px;
    background: rgba(31,39,51,.86); color: #fff; border-radius: 6px;
    padding: 3px 8px; font-size: 11px; opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  .flash.on { opacity: 1; }
  .zoombar {
    position: absolute; right: 10px; top: 8px; display: flex; gap: 4px;
    background: rgba(255,255,255,.92); border: 1px solid rgba(128,128,128,.2);
    border-radius: 8px; padding: 3px;
  }
  .zoombar button {
    border: 0; background: transparent; color: #3a4a63; cursor: pointer;
    font-size: 11px; padding: 2px 7px; border-radius: 5px;
  }
  .zoombar button:hover { background: rgba(76,125,240,.12); }
  .edge-panel {
    position: absolute; right: 10px; top: 46px; width: 268px;
    background: rgba(255,255,255,.98); border: 1px solid rgba(76,125,240,.35);
    border-radius: 10px; box-shadow: 0 8px 24px rgba(31,39,51,.14);
    padding: 10px; z-index: 5; display: none;
  }
  .edge-panel h4 { margin: 0 0 4px; font-size: 12px; color: #2b3a55; }
  .edge-panel .edge-route { color: #6b7a90; font-size: 11px; margin-bottom: 6px; word-break: break-all; }
  .edge-panel label { display: block; color: #5b6b82; font-size: 11px; margin-bottom: 3px; }
  .edge-panel input {
    width: 100%; border: 1px solid #cfd8e6; border-radius: 6px; padding: 5px 7px;
    font-size: 12px; margin-bottom: 7px; outline: none;
  }
  .edge-panel input:focus { border-color: #4c7df0; box-shadow: 0 0 0 2px rgba(76,125,240,.16); }
  .edge-panel .edge-actions { display: flex; gap: 6px; }
  .edge-panel button {
    border: 1px solid #cfd8e6; background: #fff; color: #2b3a55;
    border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
  }
  .edge-panel button.primary { background: #4c7df0; border-color: #4c7df0; color: #fff; }
  .edge-panel button.danger { color: #c62f36; border-color: #f0c4c6; }
  .edge-panel .edge-tip { color: #8a97a8; font-size: 10px; margin-top: 5px; }
  .box { fill: rgba(76,125,240,.10); stroke: #4c7df0; stroke-width: 1; stroke-dasharray: 4 3; }
  .resizer {
    position: absolute; right: 4px; bottom: 4px; width: 16px; height: 16px;
    cursor: nwse-resize; opacity: .65;
    border-right: 2px solid #8fa2c0; border-bottom: 2px solid #8fa2c0;
  }
  .resizer:hover { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="palette" id="palette"><h4>块库（拖到画布）</h4></div>
  <div class="board">
    <div class="hint">拖节点移动 · Shift/Alt+拖空白框选 · 右侧圆点连线 · 点边设置条件 · Delete 删节点/边 · 滚轮缩放</div>
    <div class="zoombar">
      <button type="button" data-zoom="out" title="缩小">−</button>
      <button type="button" data-zoom="reset" title="恢复 100%">100%</button>
      <button type="button" data-zoom="in" title="放大">+</button>
      <button type="button" data-zoom="fit" title="适配视图">适配</button>
    </div>
    <div class="edge-panel" id="edgePanel">
      <h4>边设置</h4>
      <div class="edge-route" id="edgeRoute"></div>
      <label for="edgeCondition">条件（留空 = 无条件边）</label>
      <input id="edgeCondition" type="text" placeholder="例如 size / style / care / other" />
      <div class="edge-actions">
        <button type="button" class="primary" id="edgeApply">应用</button>
        <button type="button" class="danger" id="edgeDelete">删除边</button>
        <button type="button" id="edgeCancel">取消</button>
      </div>
      <div class="edge-tip">条件值必须和 branch 的 route / 条件边标签一致。</div>
    </div>
    <svg id="board" viewBox="0 0 1180 470" preserveAspectRatio="none"></svg>
    <div class="flash" id="flash"></div>
    <div class="resizer" id="resizer" title="拖动放大画布"></div>
  </div>
</div>
<script>
(function () {
  var NODE_W = 184, NODE_H = 64, PORT_R = 5, BOARD_W = 1180, BOARD_H = 470;
  var START = "__start__", END = "__end__";

  var model = {
    nodes: [], edges: [], blocks: [], errors: [],
    selected: null, selection: [], clipboard: null, showPalette: true,
    selectedEdge: null
  };
  var drag = null;      // { id, start, origins, moved }
  var link = null;      // { from, x, y }
  var pan = null;       // { cx, cy, vx, vy, moved }
  var box = null;       // { sx, sy, x, y }
  var resize = null;    // { cy, h }
  var boardH = 470;
  var view = { x: 0, y: 0, w: BOARD_W, h: BOARD_H };
  try {
    var savedView = JSON.parse(localStorage.getItem("ah-canvas-view") || "null");
    if (savedView && Number(savedView.w) > 0 && Number(savedView.h) > 0) {
      view = { x: Number(savedView.x) || 0, y: Number(savedView.y) || 0, w: Number(savedView.w), h: Number(savedView.h) };
    }
  } catch (err) {}
  var viewTimer = null;
  var version = 0;
  var svg = document.getElementById("board");
  var palette = document.getElementById("palette");
  var wrap = document.querySelector(".wrap");
  var flashBox = document.getElementById("flash");
  var resizer = document.getElementById("resizer");
  var edgePanel = document.getElementById("edgePanel");
  var edgeRoute = document.getElementById("edgeRoute");
  var edgeCondition = document.getElementById("edgeCondition");
  var flashTimer = null;
  try { boardH = Number(localStorage.getItem("ah-canvas-height")) || 470; } catch (err) { boardH = 470; }

  // ---------------- Streamlit 静态组件协议 ----------------
  function send(type, data) {
    var message = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
    window.parent.postMessage(message, "*");
  }
  function setValue(value) {
    send("streamlit:setComponentValue", { value: value, dataType: "json" });
  }
  function setHeight(height) {
    send("streamlit:setFrameHeight", { height: height });
  }
  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") { return; }
    applyArgs(event.data.args || {});
  });

  function applyArgs(rawArgs) {
    // Python 侧统一用 payload={...} 传参，这里兼容两种形状。
    var args = (rawArgs && rawArgs.payload) || rawArgs || {};
    model.blocks = Array.isArray(args.blocks) ? args.blocks : [];
    model.nodes = (Array.isArray(args.nodes) ? args.nodes : []).map(function (node) {
      return Object.assign({}, node, { x: Number(node.x) || 0, y: Number(node.y) || 0 });
    });
    // 保留整条边（可能带第三个条件标签），否则一次拖动就会把条件边降级成普通边。
    model.edges = (Array.isArray(args.edges) ? args.edges : []).map(function (edge) {
      return Array.prototype.map.call(edge, String);
    });
    model.errors = Array.isArray(args.errors) ? args.errors : [];
    model.showPalette = args.show_palette !== false;
    model.selectedEdge = null;
    if (edgePanel) { edgePanel.style.display = "none"; }
    var keep = args.selected || null;
    if (keep && !findNode(keep)) { keep = null; }
    model.selected = keep;
    var saved = Array.isArray(args.selection) ? args.selection : [];
    model.selection = saved.filter(function (id) { return !!findNode(id); });
    if (!model.selection.length && keep) { model.selection = [keep]; }
    if (keep && model.selection.indexOf(keep) < 0) { model.selection = [keep]; }
    // keep 为空时不要清空 selection：Python 回传第一帧可能还没拿到新的主选中，
    // 清空会把刚框选的多选状态吃掉。真正的空白点击在 JS 侧已经主动清空。
    if (wrap) { wrap.classList.toggle("palette-off", !model.showPalette); }
    svg.style.height = boardH + "px";
    renderPalette();
    applyView();
    draw();
    setHeight(boardH + 40);
  }

  // ---------------- 小工具 ----------------
  function esc(text) {
    return String(text === undefined || text === null ? "" : text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function findNode(id) {
    for (var i = 0; i < model.nodes.length; i++) {
      if (model.nodes[i].id === id) { return model.nodes[i]; }
    }
    return null;
  }
  function isAnchor(node) {
    return node && (node.kind === "start" || node.kind === "end");
  }
  function clip(text, limit) {
    var value = String(text || "");
    return value.length > limit ? value.slice(0, limit - 1) + "…" : value;
  }
  function flash(text) {
    flashBox.textContent = text;
    flashBox.classList.add("on");
    if (flashTimer) { clearTimeout(flashTimer); }
    flashTimer = setTimeout(function () { flashBox.classList.remove("on"); }, 1400);
  }
  function saveView() {
    if (viewTimer) { clearTimeout(viewTimer); }
    viewTimer = setTimeout(function () {
      try { localStorage.setItem("ah-canvas-view", JSON.stringify(view)); } catch (err) {}
    }, 160);
  }
  function applyView() {
    svg.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h);
    saveView();
  }
  function toBoard(event) {
    var rect = svg.getBoundingClientRect();
    return {
      x: view.x + (event.clientX - rect.left) * view.w / (rect.width || 1),
      y: view.y + (event.clientY - rect.top) * view.h / (rect.height || 1)
    };
  }
  function zoomAt(factor, event) {
    var point = event ? toBoard(event) : { x: view.x + view.w / 2, y: view.y + view.h / 2 };
    var nextW = Math.max(BOARD_W * 0.4, Math.min(BOARD_W * 2.2, view.w / factor));
    var ratio = nextW / view.w;
    view.x = point.x - (point.x - view.x) * ratio;
    view.y = point.y - (point.y - view.y) * ratio;
    view.w = nextW;
    view.h = BOARD_H * nextW / BOARD_W;
    applyView();
  }
  function fitView() {
    var nodes = model.nodes;
    if (!nodes.length) {
      view = { x: 0, y: 0, w: BOARD_W, h: BOARD_H };
      applyView();
      return;
    }
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(function (node) {
      minX = Math.min(minX, node.x); minY = Math.min(minY, node.y);
      maxX = Math.max(maxX, node.x + NODE_W); maxY = Math.max(maxY, node.y + NODE_H);
    });
    var pad = 60;
    var w = Math.max(BOARD_W * 0.4, maxX - minX + pad * 2);
    var h = Math.max(BOARD_H * 0.55, maxY - minY + pad * 2);
    view = { x: minX - pad, y: minY - pad, w: w, h: h };
    applyView();
  }
  function uniqueId(fn) {
    var base = String(fn || "step");
    var index = 1;
    while (findNode(base + index)) { index += 1; }
    return base + index;
  }
  function emit(extra) {
    version += 1;
    var anchors = {};
    model.nodes.forEach(function (node) {
      if (isAnchor(node)) { anchors[node.id] = [Math.round(node.x), Math.round(node.y)]; }
    });
    setValue(Object.assign({
      nodes: model.nodes.filter(function (node) { return !isAnchor(node); }).map(function (node) {
        var item = { id: node.id, fn: node.fn, x: Math.round(node.x), y: Math.round(node.y) };
        if (node.copy_of) { item.copy_of = node.copy_of; }
        return item;
      }),
      edges: model.edges,
      anchors: anchors,
      selected: model.selected,
      selection: model.selection.slice(),
      version: version
    }, extra || {}));
  }

  // ---------------- 绘制 ----------------
  function renderPalette() {
    var html = "<h4>块库（拖到画布）</h4>";
    model.blocks.forEach(function (block) {
      html += '<div class="block" draggable="true" data-block="' + esc(block.fn) + '">' +
        "<b>" + esc(block.label) + "</b><span>" + esc(block.fn) + "</span></div>";
    });
    palette.innerHTML = html;
    var chips = palette.querySelectorAll("[data-block]");
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener("dragstart", function (event) {
        event.dataTransfer.setData("text/plain", this.getAttribute("data-block"));
        event.dataTransfer.effectAllowed = "copy";
      });
    }
  }

  function nodeSvg(node) {
    var selected = model.selection.indexOf(node.id) >= 0;
    var primary = model.selected === node.id;
    var broken = model.errors.indexOf(node.id) >= 0;
    var anchor = isAnchor(node);
    var stroke = broken ? "#e5484d" : (selected ? "#4c7df0" : "#c3cddd");
    var fill = broken ? "#fff1f0" : (selected ? "#eef4ff" : (anchor ? "#e8f5e9" : "#ffffff"));
    var width = broken || selected ? 2 : 1;
    var out = '<g data-node="' + esc(node.id) + '" style="cursor:grab">';
    out += '<rect x="' + node.x + '" y="' + node.y + '" width="' + NODE_W + '" height="' + NODE_H +
      '" rx="' + (anchor ? NODE_H / 2 : 10) + '" fill="' + fill + '" stroke="' + stroke +
      '" stroke-width="' + width + '"/>';
    var title = anchor ? node.label : clip(node.label || node.id, 11);
    var subtitle = anchor ? "" : clip(node.id + " · " + node.fn, 20);
    out += '<text x="' + (node.x + 10) + '" y="' + (node.y + (subtitle ? 23 : 34)) +
      '" font-size="12.5" font-weight="600" fill="#25324a">' + esc(title) + "</text>";
    if (subtitle) {
      out += '<text x="' + (node.x + 10) + '" y="' + (node.y + 41) +
        '" font-size="10" fill="#7a8798">' + esc(subtitle) + "</text>";
    }
    if (node.kind !== "start") {
      out += '<circle data-port="in" data-node="' + esc(node.id) + '" cx="' + node.x + '" cy="' +
        (node.y + NODE_H / 2) + '" r="' + PORT_R + '" fill="#4c7df0" style="cursor:crosshair"/>';
    }
    if (node.kind !== "end") {
      out += '<circle data-port="out" data-node="' + esc(node.id) + '" cx="' + (node.x + NODE_W) +
        '" cy="' + (node.y + NODE_H / 2) + '" r="' + PORT_R + '" fill="#4c7df0" style="cursor:crosshair"/>';
    }
    if (primary && !anchor) {
      out += '<g data-del="' + esc(node.id) + '" style="cursor:pointer">' +
        '<circle cx="' + (node.x + NODE_W - 10) + '" cy="' + (node.y + 10) + '" r="9" fill="#e5484d"/>' +
        '<text x="' + (node.x + NODE_W - 13.5) + '" y="' + (node.y + 14) +
        '" font-size="11" fill="#ffffff">×</text></g>';
    }
    out += "</g>";
    return out;
  }

  function edgePath(source, target) {
    var x1 = source.x + NODE_W, y1 = source.y + NODE_H / 2;
    var x2 = target.x, y2 = target.y + NODE_H / 2;
    var dx = Math.max(40, Math.abs(x2 - x1) * 0.45);
    return "M" + x1 + "," + y1 + " C" + (x1 + dx) + "," + y1 + " " + (x2 - dx) + "," + y2 +
      " " + x2 + "," + y2;
  }

  function hideEdgePanel() {
    model.selectedEdge = null;
    if (edgePanel) { edgePanel.style.display = "none"; }
  }

  function showEdgePanel(index) {
    var edge = model.edges[index];
    if (!edge || !edgePanel) { return; }
    edgeRoute.textContent = edge[0] + " → " + edge[1];
    edgeCondition.value = edge[2] || "";
    edgePanel.style.display = "block";
    setTimeout(function () { try { edgeCondition.focus(); edgeCondition.select(); } catch (err) {} }, 0);
  }

  function selectEdge(index) {
    if (!model.edges[index]) { return; }
    model.selectedEdge = index;
    model.selection = [];
    model.selected = null;
    draw();
    showEdgePanel(index);
  }

  function applyEdgeCondition() {
    var index = model.selectedEdge;
    var edge = model.edges[index];
    if (!edge) { hideEdgePanel(); draw(); return; }
    var when = String(edgeCondition.value || "").trim();
    // 始终带第三项：空字符串是“显式清空”，后端才会覆盖旧条件；
    // 只发 [from,to] 会被 merge_canvas 当成“画布没传条件”而保留旧值。
    model.edges[index] = [edge[0], edge[1], when];
    hideEdgePanel();
    draw();
    emit();
    flash(when ? ("已设置条件 " + when) : "已清空条件");
  }

  function deleteSelectedEdge() {
    var index = model.selectedEdge;
    if (index === null || !model.edges[index]) { return; }
    model.edges.splice(index, 1);
    hideEdgePanel();
    draw();
    emit();
    flash("已删除连线");
  }

  function draw() {
    var parts = [];
    parts.push('<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" ' +
      'markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa2c0"/></marker></defs>');
    model.edges.forEach(function (edge, index) {
      var source = findNode(edge[0]), target = findNode(edge[1]);
      if (!source || !target) { return; }
      var d = edgePath(source, target);
      var selected = model.selectedEdge === index;
      var stroke = selected ? "#2f5bd3" : "#8fa2c0";
      var width = selected ? 2.6 : 1.6;
      parts.push('<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + width +
        '" marker-end="url(#arrow)"/>');
      if (edge[2]) {
        var mx = (source.x + NODE_W + target.x) / 2;
        var my = (source.y + target.y) / 2 + NODE_H / 2;
        var label = String(edge[2]);
        var lw = Math.max(44, label.length * 7 + 14);
        parts.push('<g style="pointer-events:none">' +
          '<rect x="' + (mx - lw / 2) + '" y="' + (my - 10) + '" width="' + lw + '" height="18" rx="9" ' +
          'fill="' + (selected ? "#dbe7ff" : "#eef4ff") + '" stroke="#c7d7fe"/>' +
          '<text x="' + mx + '" y="' + (my + 3.5) + '" text-anchor="middle" font-size="10" ' +
          'fill="#2f5bd3">' + esc(label) + '</text></g>');
      }
      parts.push('<path data-edge="' + index + '" d="' + d + '" fill="none" stroke="transparent" ' +
        'stroke-width="14" style="cursor:pointer"><title>点击设置条件 / Delete 删除边</title></path>');
    });
    if (link) {
      var from = findNode(link.from);
      if (from) {
        parts.push('<path d="M' + (from.x + NODE_W) + "," + (from.y + NODE_H / 2) + " L" + link.x + "," +
          link.y + '" fill="none" stroke="#4c7df0" stroke-width="1.6" stroke-dasharray="4 3"/>');
      }
    }
    model.nodes.forEach(function (node) { parts.push(nodeSvg(node)); });
    if (box) {
      var bx = Math.min(box.sx, box.x), by = Math.min(box.sy, box.y);
      var bw = Math.abs(box.x - box.sx), bh = Math.abs(box.y - box.sy);
      parts.push('<rect class="box" x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '"/>');
    }
    svg.innerHTML = parts.join("");
  }

  // ---------------- 交互 ----------------
  function selectOnly(id) {
    hideEdgePanel();
    model.selection = id ? [id] : [];
    model.selected = id || null;
    draw();
    emit();
  }
  function primaryOf(ids) {
    // START/END 不能作为 Python 侧的主选中（检查器只认普通节点）；
    // 多选里带了锚点时，主选中取最后一个非锚点。
    for (var i = ids.length - 1; i >= 0; i--) {
      var node = findNode(ids[i]);
      if (node && !isAnchor(node)) { return ids[i]; }
    }
    return ids.length ? ids[ids.length - 1] : null;
  }
  function toggleSelect(id) {
    var index = model.selection.indexOf(id);
    if (index >= 0) { model.selection.splice(index, 1); }
    else { model.selection.push(id); }
    model.selected = primaryOf(model.selection);
    draw();
    emit();
  }
  function selectedNodeIds() {
    return model.selection.filter(function (id) {
      var node = findNode(id);
      return !!node && !isAnchor(node);
    });
  }
  function deleteNodes(ids) {
    if (!ids.length) { return false; }
    model.nodes = model.nodes.filter(function (node) { return ids.indexOf(node.id) < 0; });
    model.edges = model.edges.filter(function (edge) {
      return ids.indexOf(edge[0]) < 0 && ids.indexOf(edge[1]) < 0;
    });
    model.selection = model.selection.filter(function (id) { return ids.indexOf(id) < 0; });
    if (ids.indexOf(model.selected) >= 0) { model.selected = null; }
    hideEdgePanel();
    return true;
  }
  function copySelection() {
    var ids = selectedNodeIds();
    if (!ids.length) { return false; }
    var nodes = ids.map(function (id) { return Object.assign({}, findNode(id)); });
    var edges = model.edges.filter(function (edge) {
      return ids.indexOf(edge[0]) >= 0 && ids.indexOf(edge[1]) >= 0;
    }).map(function (edge) {
      return edge.length >= 3 ? [edge[0], edge[1], edge[2]] : [edge[0], edge[1]];
    });
    model.clipboard = { nodes: nodes, edges: edges };
    flash("已复制 " + nodes.length + " 个节点");
    return true;
  }
  function pasteClipboard(offset) {
    if (!model.clipboard || !model.clipboard.nodes.length) { return false; }
    var mapping = {}, newIds = [];
    model.clipboard.nodes.forEach(function (source) {
      var id = uniqueId(source.fn);
      mapping[source.id] = id;
      model.nodes.push(Object.assign({}, source, {
        id: id, x: source.x + offset, y: source.y + offset, copy_of: source.id
      }));
      newIds.push(id);
    });
    model.clipboard.edges.forEach(function (edge) {
      if (mapping[edge[0]] && mapping[edge[1]]) {
        var item = [mapping[edge[0]], mapping[edge[1]]];
        if (edge.length >= 3 && edge[2]) { item.push(edge[2]); }
        model.edges.push(item);
      }
    });
    model.selection = newIds;
    model.selected = newIds[0] || null;
    draw();
    emit();
    flash("已粘贴 " + newIds.length + " 个节点");
    return true;
  }
  function cutSelection() {
    var ids = selectedNodeIds();
    if (!ids.length) { return; }
    copySelection();
    deleteNodes(ids);
    draw();
    emit({ cut: true });
    flash("已剪切 " + ids.length + " 个节点");
  }
  function duplicateSelection() {
    if (!copySelection()) { return; }
    pasteClipboard(28);
  }
  function command(name) {
    version += 1;
    setValue({ command: name, version: version });
  }

  svg.addEventListener("mousedown", function (event) {
    var port = event.target.closest && event.target.closest("[data-port]");
    if (port) {
      var portNode = port.getAttribute("data-node");
      if (port.getAttribute("data-port") === "out") {
        event.preventDefault();
        var point = toBoard(event);
        link = { from: portNode, x: point.x, y: point.y };
        draw();
        return;
      }
    }
    var nodeEl = event.target.closest && event.target.closest("[data-node]");
    if (nodeEl) {
      var node = findNode(nodeEl.getAttribute("data-node"));
      if (!node) { return; }
      event.preventDefault();
      hideEdgePanel();
      if (event.shiftKey || event.altKey) {
        toggleSelect(node.id);
        return;
      }
      var selectionChanged = model.selection.indexOf(node.id) < 0;
      if (selectionChanged) {
        model.selection = [node.id];
        model.selected = node.id;
        draw();
      }
      var start = toBoard(event);
      var origins = {};
      model.selection.forEach(function (id) {
        var item = findNode(id);
        if (item) { origins[id] = [item.x, item.y]; }
      });
      drag = {
        id: node.id, start: start, origins: origins,
        moved: false, selectionChanged: selectionChanged
      };
      return;
    }
    var edgeEl = event.target.closest && event.target.closest("[data-edge]");
    if (edgeEl) {
      event.preventDefault();
      selectEdge(Number(edgeEl.getAttribute("data-edge")));
      return;
    }
    // 空白处：Shift/Alt+拖 = 框选；普通拖 = 平移画布。
    event.preventDefault();
    hideEdgePanel();
    var blank = toBoard(event);
    if (event.shiftKey || event.altKey) {
      box = { sx: blank.x, sy: blank.y, x: blank.x, y: blank.y };
      return;
    }
    pan = {
      cx: event.clientX, cy: event.clientY,
      vx: view.x, vy: view.y, moved: false
    };
  });

  window.addEventListener("mousemove", function (event) {
    if (resize) {
      boardH = Math.max(340, Math.min(1000, resize.h + event.clientY - resize.cy));
      svg.style.height = boardH + "px";
      setHeight(boardH + 40);
      return;
    }
    if (drag) {
      var primary = findNode(drag.id);
      if (!primary) { drag = null; return; }
      var point = toBoard(event);
      var dx = point.x - drag.start.x;
      var dy = point.y - drag.start.y;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) { drag.moved = true; }
      Object.keys(drag.origins).forEach(function (id) {
        var item = findNode(id);
        var origin = drag.origins[id];
        if (item && origin) {
          item.x = origin[0] + dx;
          item.y = origin[1] + dy;
        }
      });
      draw();
    } else if (box) {
      var here = toBoard(event);
      box.x = here.x;
      box.y = here.y;
      draw();
    } else if (link) {
      var linkPoint = toBoard(event);
      link.x = linkPoint.x;
      link.y = linkPoint.y;
      draw();
    } else if (pan) {
      var rect = svg.getBoundingClientRect();
      var panX = (event.clientX - pan.cx) * view.w / (rect.width || 1);
      var panY = (event.clientY - pan.cy) * view.h / (rect.height || 1);
      if (Math.abs(panX) > 1 || Math.abs(panY) > 1) { pan.moved = true; }
      view.x = pan.vx - panX;
      view.y = pan.vy - panY;
      applyView();
    }
  });

  window.addEventListener("mouseup", function (event) {
    if (resize) {
      resize = null;
      try { localStorage.setItem("ah-canvas-height", String(boardH)); } catch (err) {}
      return;
    }
    if (box) {
      var left = Math.min(box.sx, box.x), right = Math.max(box.sx, box.x);
      var top = Math.min(box.sy, box.y), bottom = Math.max(box.sy, box.y);
      var picked = [];
      if (right - left > 6 || bottom - top > 6) {
        model.nodes.forEach(function (node) {
          var within = node.x < right && node.x + NODE_W > left &&
            node.y < bottom && node.y + NODE_H > top;
          if (within) { picked.push(node.id); }
        });
      }
      box = null;
      model.selection = picked;
      model.selected = primaryOf(picked);
      draw();
      emit();
      return;
    }
    if (pan) {
      var panned = pan.moved;
      pan = null;
      if (!panned) {
        model.selection = [];
        model.selected = null;
        draw();
        emit();
      }
      return;
    }
    if (drag) {
      var moved = drag.moved;
      var selectionChanged = drag.selectionChanged;
      drag = null;
      // 单击也要 emit：否则 Python 不知道选中变了，右侧检查器要等到下一次拖动才刷新。
      if (moved || selectionChanged) { emit(); }
      return;
    }
    if (!link) { return; }
    var from = link.from;
    link = null;
    var hit = document.elementFromPoint(event.clientX, event.clientY);
    var targetEl = hit && hit.closest ? hit.closest("[data-node]") : null;
    var targetId = targetEl ? targetEl.getAttribute("data-node") : null;
    if (targetId && targetId !== from) {
      var pair = [from, targetId];
      var exists = model.edges.some(function (edge) {
        return edge[0] === pair[0] && edge[1] === pair[1];
      });
      var fromNode = findNode(from);
      if (exists) {
        flash("这条连线已经存在");
      } else if (fromNode && fromNode.kind === "end") {
        flash("END 没有输出口");
      } else {
        var targetNode = findNode(targetId);
        if (targetNode && targetNode.kind === "start") {
          flash("START 没有输入口");
        } else {
          model.edges.push(pair);
          emit();
          flash("已连接 " + from + " → " + targetId + "；点边可设置条件");
        }
      }
    }
    draw();
  });

  svg.addEventListener("click", function (event) {
    var del = event.target.closest && event.target.closest("[data-del]");
    if (!del) { return; }
    var id = del.getAttribute("data-del");
    if (!deleteNodes([id])) { return; }
    draw();
    emit();
    flash("已删除节点 " + id + "（可撤销）");
  });

  svg.addEventListener("dragover", function (event) {
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
  });

  svg.addEventListener("drop", function (event) {
    event.preventDefault();
    var fn = event.dataTransfer.getData("text/plain");
    if (!fn) { return; }
    var point = toBoard(event);
    model.nodes.push({
      id: uniqueId(fn),
      fn: fn,
      label: labelOf(fn),
      kind: "",
      x: point.x - NODE_W / 2,
      y: point.y - NODE_H / 2
    });
    draw();
    emit();
    flash("已添加节点 " + fn);
  });

  function labelOf(fn) {
    for (var i = 0; i < model.blocks.length; i++) {
      if (model.blocks[i].fn === fn) { return model.blocks[i].label; }
    }
    return fn;
  }

  svg.addEventListener("wheel", function (event) {
    event.preventDefault();
    zoomAt(event.deltaY < 0 ? 1.12 : 1 / 1.12, event);
  }, { passive: false });

  document.addEventListener("keydown", function (event) {
    var tag = String((event.target && event.target.tagName) || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") { return; }
    var key = String(event.key || "").toLowerCase();
    var ctrl = event.ctrlKey || event.metaKey;

    if (ctrl && key === "z" && !event.shiftKey) {
      event.preventDefault(); command("undo"); return;
    }
    if (ctrl && (key === "y" || (key === "z" && event.shiftKey))) {
      event.preventDefault(); command("redo"); return;
    }
    if (ctrl && key === "c") { event.preventDefault(); copySelection(); return; }
    if (ctrl && key === "x") { event.preventDefault(); cutSelection(); return; }
    if (ctrl && key === "v") { event.preventDefault(); pasteClipboard(28); return; }
    if (ctrl && key === "d") { event.preventDefault(); duplicateSelection(); return; }

    if ((event.key === "Delete" || event.key === "Backspace") && model.selectedEdge !== null) {
      event.preventDefault();
      deleteSelectedEdge();
      return;
    }

    var ids = selectedNodeIds();
    if ((event.key === "Delete" || event.key === "Backspace") && ids.length) {
      event.preventDefault();
      deleteNodes(ids);
      draw();
      emit();
      flash("已删除 " + ids.length + " 个节点（可撤销）");
      return;
    }
    if (!ids.length) { return; }
    var step = event.shiftKey ? 16 : 4;
    var moved = false;
    ids.forEach(function (id) {
      var node = findNode(id);
      if (!node) { return; }
      if (event.key === "ArrowLeft") { node.x -= step; moved = true; }
      if (event.key === "ArrowRight") { node.x += step; moved = true; }
      if (event.key === "ArrowUp") { node.y -= step; moved = true; }
      if (event.key === "ArrowDown") { node.y += step; moved = true; }
    });
    if (moved) {
      event.preventDefault();
      draw();
      emit();
    }
  });

  document.getElementById("edgeApply").addEventListener("click", applyEdgeCondition);
  document.getElementById("edgeDelete").addEventListener("click", deleteSelectedEdge);
  document.getElementById("edgeCancel").addEventListener("click", function () {
    hideEdgePanel();
    draw();
  });
  document.getElementById("edgeCondition").addEventListener("keydown", function (event) {
    if (event.key === "Enter") { event.preventDefault(); applyEdgeCondition(); }
    if (event.key === "Escape") { event.preventDefault(); hideEdgePanel(); draw(); }
  });

  var zoomButtons = document.querySelectorAll("[data-zoom]");
  for (var zi = 0; zi < zoomButtons.length; zi++) {    zoomButtons[zi].addEventListener("click", function () {
      var action = this.getAttribute("data-zoom");
      if (action === "fit") { fitView(); }
      else if (action === "reset") { view = { x: 0, y: 0, w: BOARD_W, h: BOARD_H }; applyView(); }
      else if (action === "in") { zoomAt(1.2); }
      else { zoomAt(1 / 1.2); }
    });
  }

  if (resizer) {
    resizer.addEventListener("mousedown", function (event) {
      resize = { cy: event.clientY, h: boardH };
      event.preventDefault();
      event.stopPropagation();
    });
  }

  svg.style.height = boardH + "px";
  draw();
  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight(boardH + 40);
})();
</script>
</body>
</html>
